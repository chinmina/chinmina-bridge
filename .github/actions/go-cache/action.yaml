name: Go cache
description: >-
  Restores the Go module and build caches for the Go on PATH. A key is written
  once, so exactly one job per `name` sets `save`: any other saver would race
  it for the key.

inputs:
  name:
    description: Separates caches for jobs whose builds share little.
    default: build
  save:
    description: Save the caches at the end of a successful job when the key missed.
    default: "false"

runs:
  using: composite
  steps:
    - name: Locate Go caches
      id: go
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.name }}
        SCOPE: ${{ github.ref_name == github.event.repository.default_branch && 'main' || 'branch' }}
        GO_SUM_HASH: ${{ hashFiles('go.sum') }}
      run: |
        base="go-${CACHE_NAME}-${RUNNER_OS}-${RUNNER_ARCH}-$(go env GOVERSION)"
        {
          echo "key=${base}-${SCOPE}-${GO_SUM_HASH}"
          echo "fallback=${base}-main-"
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # On a miss, fall back to main's newest cache for the same Go version, so
    # a go.sum change recompiles only what changed. A fallback match is not a
    # hit, so the saving job still writes the exact key.
    - if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.go.outputs.paths }}
        key: ${{ steps.go.outputs.key }}
        restore-keys: ${{ steps.go.outputs.fallback }}

    - if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.go.outputs.paths }}
        key: ${{ steps.go.outputs.key }}
        restore-keys: ${{ steps.go.outputs.fallback }}
