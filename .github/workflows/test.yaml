name: verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: # define the types that will run
          - unit
          - integration
          - fuzz
        include: # add complete just target for each type
          - type: unit
            just-target: ci-unit
            upload-coverage: true
          - type: integration
            just-target: ci-integration
            upload-coverage: true
          - type: fuzz
            just-target: ci-fuzz
            upload-coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # mise.toml is the only source of tool versions. Its cache is saved from
      # main pushes only, since a PR's cache is visible to that PR alone.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: go just
          cache_save: ${{ github.event_name == 'push' }}

      - name: Run ${{ matrix.type }} tests
        run: just ${{ matrix.just-target }}

      - name: Upload coverage to Codecov
        if: matrix.upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.type }}
          cleanup: true

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: go golangci-lint
          cache_save: ${{ github.event_name == 'push' }}

      # install-mode: none uses the golangci-lint mise installed.
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          install-mode: none

      - name: Enforce JSON v2 in integration and fuzz tests
        run: golangci-lint run --build-tags=integration,fuzz --enable-only=depguard
